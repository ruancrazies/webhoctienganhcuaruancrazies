name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Cổng của theme/avatar/khung: registry khớp thư mục, id duy nhất, tương phản, ảnh đủ cỡ và dưới ngân sách KB (tests/cosmetics)
      - run: npm run check:registry
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  # Test giao diện cần Supabase + tài khoản thử nên chạy riêng (workflow_dispatch), không chặn mọi PR.
